/* Weekly rank badges: when a week closes, everyone gets the badge of the rank that week's posts were worth (the week's
   posts / 7 a day, the same steps as the live rank). Counted from the week the profile was made; a week without a post
   is "Constipated". Returns the closed weeks per rank, oldest first; the same badge won again shows as ×2, ×3. */
function weekBadges(uid){
  const ps=okPosts().filter(p=>p.author===uid&&counts(p)), joined=(S.people[uid]||{}).joined, out=RANKS.map(()=>[]);
  let first=typeof joined==='number'&&joined>9466848e5?joined:Infinity; for(const p of ps) if(p.at<first) first=p.at;
  if(!isFinite(first)) return out;
  const cnt={}; for(const p of ps){ const k=weekKey(p.at); cnt[k]=(cnt[k]||0)+1; }
  const cur=weekKey(now()), d=new Date(first); d.setHours(12,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7));
  for(let g=0;g<520&&d.getTime()<now();g++){ const k=weekKey(d.getTime()); if(k===cur) break; const avg=(cnt[k]||0)/7; let i=0; RANKS.forEach((r,j)=>{ if(avg>=r.min) i=j; }); out[i].push(k); d.setDate(d.getDate()+7); }
  return out;
}

}
function rankOf(uid){

let awT, wkT;
function checkAwards(){
  clearTimeout(awT);
  awT=setTimeout(()=>{
    if(!S.uid||!S.postsLoaded||onbEl||S.stack.length) return;
    const list=[]; for(const it of awardItems(S.uid)) if(it.k!=='all') for(const key of it.keys) list.push({k:it.k,t:it.t,key,id:it.k+'|'+it.t+'|'+key});
    let seen=null; try{ seen=JSON.parse(localStorage.getItem('pz_aw_'+S.uid)||'null'); }catch{}
    const fresh=list.filter(x=>!Array.isArray(seen)||!seen.includes(x.id)); if(!fresh.length) return;
    try{ localStorage.setItem('pz_aw_'+S.uid,JSON.stringify(list.map(x=>x.id).slice(0,800))); }catch{ return; }
    pushLayer(L_won(fresh));
  },900);
  clearTimeout(wkT);
  wkT=setTimeout(()=>{
    if(!S.uid||!S.postsLoaded||onbEl||S.stack.length) return;
    const wb=weekBadges(S.uid), all=[]; wb.forEach((keys,i)=>keys.forEach(k=>all.push({i,k}))); if(!all.length) return; all.sort((a,b)=>a.k<b.k?-1:1);
    let seen=null; try{ seen=JSON.parse(localStorage.getItem('pz_wk_'+S.uid)||'null'); }catch{}
    const fresh=all.filter(x=>!Array.isArray(seen)||!seen.includes(x.k)); if(!fresh.length) return;
    try{ localStorage.setItem('pz_wk_'+S.uid,JSON.stringify(all.map(x=>x.k).slice(-600))); }catch{ return; }
    const last=fresh[fresh.length-1]; pushLayer(L_wonRank(last.i,last.k,wb[last.i].indexOf(last.k)+1));
  },1600);
}

/* try the recognizer on any two photos: shows what it cuts out and how alike it finds them */
function L_matchtest(){
  const st=[null,null];
  const el=mkLayer(head('Egyezés-teszt')+`<div class="l-body"><div class="mt"><p class="muted">Válassz két fotót. Megmutatom, mit vág ki belőlük a felismerő (narancssárgával), és mennyire tartja őket ugyanannak.</p>
  <div class="mt-row">${[0,1].map(i=>`<button class="mt-slot" data-mt="${i}"><canvas width="320" height="320"></canvas><span>${i+1}. fotó kiválasztása</span></button>`).join('')}</div><div class="mt-res" id="mtres"></div></div></div>`);
  function drawSlot(cv,img,pm){
    const x=cv.getContext('2d'), W=cv.width, k=Math.min(W/img.naturalWidth,W/img.naturalHeight), w=img.naturalWidth*k, hh=img.naturalHeight*k, ox=(W-w)/2, oy=(W-hh)/2;
    x.clearRect(0,0,W,W); x.drawImage(img,ox,oy,w,hh); if(!pm) return;
    const sg=pm.seg, sx=w/sg.w, sy=hh/sg.h; x.fillStyle='rgba(255,122,26,.6)';
    for(let j=0;j<sg.h;j++) for(let i=0;i<sg.w;i++) if(sg.mask[j*sg.w+i]) x.fillRect(ox+i*sx,oy+j*sy,sx+.5,sy+.5);
  }
  function result(){
    const box=el.querySelector('#mtres');
    if(!st[0]||!st[1]){ box.innerHTML=''; return; }
    if(!st[0].pm||!st[1].pm){ box.innerHTML='<p class="muted">Az egyik képen nem találtam barna témát, ezért nem tudok összehasonlítani.</p>'; return; }

  $('#top').hidden=S.tab==='reels'; $('#main').classList.toggle('full',S.tab==='reels');

let profT;
function wantProfiles(){
  clearTimeout(profT);
  profT=setTimeout(async()=>{
    if(!S.user) return;
    const ids=new Set(Object.keys(S.people)); if(S.uid) ids.add(S.uid);
    for(const p of S.posts){ if(typeof p.author==='string') ids.add(p.author); cmts(p).forEach(c=>ids.add(c.a)); }
    for(const g of S.groups){ members(g).forEach(k=>ids.add(k)); if(typeof g.createdBy==='string') ids.add(g.createdBy); }
    for(const m of Object.values(S.meta)){ if(m&&Array.isArray(m.members)) m.members.forEach(k=>typeof k==='string'&&ids.add(k)); if(m&&m.last&&typeof m.last.a==='string') ids.add(m.last.a); }
    S.chatMsgs.forEach(m=>ids.add(m.a));
    try{ S.prof=await S.user.profiles([...ids]); }catch{}
    refresh();
  },120);
}

  S.local=!!c.local; S.server=!!c.server; S.auth=c.auth||null;
  const [db,user,assets]=await Promise.all([c.use('db'),c.use('user'),c.use('assets')].map(p=>Promise.resolve(p).catch(()=>null)));
  S.db=db; S.user=user; S.assets=assets;
  if(user){ try{ S.uid=await user.id(); S.isOwner=await user.isOwner(); const cw=await user.can('data.write'); if(cw===false) S.canWrite=false; }catch{} }
  if(!db){ clearTimeout(slowT); S.offline=true; refresh(); nextOnb(); return; }
  try{
    sub(db.collection('posts').orderBy('at','desc').limit(300),s=>{ S.posts=s.docs.map(d=>({id:d.id,...(d.data()||{})})); if(!s.metadata.fromCache) S.postsLoaded=true; });
    sub(db.collection('groups'),s=>{ S.groups=s.docs.map(d=>({id:d.id,...(d.data()||{})})); });
    sub(db.collection('people'),s=>{ S.people=Object.fromEntries(s.docs.map(d=>[d.id,d.data()||{}])); if(!s.metadata.fromCache) S.peopleLoaded=true; });
    sub(db.collection('imgindex').orderBy('wk','desc').limit(60),s=>{ S.imgIndex=s.docs.map(d=>d.data()||{}); });
    sub(db.collection('chatmeta'),s=>{ S.meta=Object.fromEntries(s.docs.map(d=>[d.id,d.data()||{}])); });
  }catch(e){ console.warn(e); S.err='unavailable'; }
  if(S.canWrite) ensurePerson();
  wantProfiles(); refresh(); nextOnb();
}
/* packaged app: the system back button closes the top layer, then steps back in sign-up, then returns to the feed, then leaves */
(function(){ try{
  const app=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App; if(!app||!app.addListener) return;
  app.addListener('backButton',()=>{
    if(S.stack.length){ popLayer(); return; }
    if(onbEl){ const b=onbEl.querySelector('.auth-top [data-onb]'); if(b){ b.click(); return; } }
    else if(S.tab!=='feed'){ setTab('feed'); return; }
    if(app.minimizeApp) app.minimizeApp(); else if(app.exitApp) app.exitApp();
  });
}catch{} })();
addEventListener('hashchange',()=>{ const t=location.hash.slice(1); if(TABS.includes(t)&&t!==S.tab){ closeAll(); setTab(t); } });
setInterval(()=>{ if(!document.hidden) refresh(); },60000);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ pauseReels(); pauseFeed(); } else { playVisible(); playFeed(); } });
boot();
