<!doctype html><html lang="hu"><head><meta charset="utf-8"><title>PoopHub</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="PoopHub"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a110b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><script src="config.js"></script><script src="vendor/supabase.js"></script></head><body><title>PoopHub</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one phone-width column — header, scrolling view, bottom tab bar; camera, chats, profiles and groups slide over as full-screen layers. Single dark look: espresso brown + ember orange. */
:root{
  --bg:#1a110b;
  --surface:#25180f;
  --raise:#342217;
  --line:#4a3122;
  --fg:#f7ebde;
  --muted:#c4a58c;
  --dim:#8f7059;
  --accent:#ff7a1a;
  --accent-hi:#ffa04d;
  --ember-deep:#a8420c;
  --accent-ink:#1a110b;
  --black:#0d0805;
  --bad:#ff6b5a;
  --gold:#ffc24a;
  --silver:#dccbbb;
  --bronze:#c9824d;
  --glow:rgba(255,122,26,.38);
  --scrim:rgba(13,8,5,.55);
  --scrim-strong:rgba(13,8,5,.82);
  --on-scrim:#f7ebde;
  --ok:#5fb85f;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
/* Light: white ground, brown type, same ember orange */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#ffffff;--surface:#faf5f0;--raise:#f2e8de;--line:#e7d8ca;--fg:#2b1a10;--muted:#76563f;--dim:#9a7d67;--accent:#f26a0a;--accent-hi:#ff8a2e;--ember-deep:#b04a10;--accent-ink:#2b1a10;--silver:#bfae9f;--bronze:#c27840;--glow:rgba(242,106,10,.28);color-scheme:light}
}
:root[data-theme="light"]{--bg:#ffffff;--surface:#faf5f0;--raise:#f2e8de;--line:#e7d8ca;--fg:#2b1a10;--muted:#76563f;--dim:#9a7d67;--accent:#f26a0a;--accent-hi:#ff8a2e;--ember-deep:#b04a10;--accent-ink:#2b1a10;--silver:#bfae9f;--bronze:#c27840;--glow:rgba(242,106,10,.28);color-scheme:light}
/* the in-app theme button wins over the host and the system setting */
:root.t-light{--bg:#ffffff;--surface:#faf5f0;--raise:#f2e8de;--line:#e7d8ca;--fg:#2b1a10;--muted:#76563f;--dim:#9a7d67;--accent:#f26a0a;--accent-hi:#ff8a2e;--ember-deep:#b04a10;--accent-ink:#2b1a10;--silver:#bfae9f;--bronze:#c27840;--glow:rgba(242,106,10,.28);color-scheme:light}
:root.t-dark{--bg:#1a110b;--surface:#25180f;--raise:#342217;--line:#4a3122;--fg:#f7ebde;--muted:#c4a58c;--dim:#8f7059;--accent:#ff7a1a;--accent-hi:#ffa04d;--ember-deep:#a8420c;--accent-ink:#1a110b;--silver:#dccbbb;--bronze:#c9824d;--glow:rgba(255,122,26,.38);color-scheme:dark}
/* camera and reels stay dark in both themes, like a viewfinder */
.layer.cam,#v-reels{--bg:#1a110b;--surface:#25180f;--raise:#342217;--line:#4a3122;--fg:#f7ebde;--muted:#c4a58c;--dim:#8f7059;--accent:#ff7a1a;--accent-hi:#ffa04d;--accent-ink:#1a110b;color:var(--fg);color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;overscroll-behavior:none;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:10px}
h1,h2,h3{text-wrap:balance}
p{margin:0}
.ic{width:24px;height:24px;flex:none;display:block}
.ic.fill{fill:currentColor}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:13px}

/* shell */
#app{height:100%;max-width:560px;margin-inline:auto;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){#app{border-inline:1px solid var(--line)}}
.top{display:flex;align-items:center;gap:4px;padding:8px 10px 8px 16px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--f-display);font-weight:800;font-size:27px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;margin-right:auto;line-height:1}
.ember{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 38% 32%,var(--accent-hi),var(--accent) 52%,var(--ember-deep));box-shadow:0 0 16px var(--glow);animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 26px var(--accent)}}
/* the word mark: "Poop" is white text with nothing around it; on a light page its letters get a thin orange outline so they
   can be seen. "Hub" is black text in an orange box. */
.poo{color:#fff;paint-order:stroke fill;-webkit-text-stroke:var(--poo-edge,0px) #ff7a1a}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--poo-edge:2px}}
:root[data-theme="light"]{--poo-edge:2px}
:root.t-light{--poo-edge:2px}
:root.t-dark{--poo-edge:0px}
.hub{display:inline-block;background:#ff7a1a;color:#000;border-radius:8px;padding:1px 7px 3px;margin-left:3px}
/* the badge: black, a white P, and a black H in an orange box */
.ph{display:inline-grid;grid-template-columns:auto auto;justify-content:center;align-items:center;gap:.12em;width:38px;height:38px;border-radius:12px;background:#000;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:0;line-height:1;flex:none;overflow:hidden}
.ph b{font-weight:inherit}
.ph b:first-child{color:#fff}
.ph b:last-child{color:#000;background:#ff7a1a;border-radius:.24em;padding:.14em .12em .16em}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;position:relative;flex:none}
.icon-btn:hover:not(:disabled){background:var(--surface)}
.icon-btn.on{color:var(--accent)}
.icon-btn.lg .ic{width:28px;height:28px}
.dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.banner{margin:10px 16px 0;padding:10px 14px;border-radius:14px;background:var(--raise);border:1px solid var(--line);font-size:14px;color:var(--muted)}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
main.full{overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim);padding:5px 0;border-radius:12px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .shutter{width:54px;height:40px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 18px var(--glow)}
.tab.cam:hover .shutter{background:var(--accent-hi)}

/* avatars */
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;font-weight:700;color:var(--accent-ink);background:var(--raise);line-height:1}
.gbadge{border-radius:30%;display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--accent-ink);flex:none;line-height:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--accent-hi)}
.btn.ghost{background:var(--raise);color:var(--fg)}
.btn.ghost:hover:not(:disabled){background:var(--line)}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:11px}
.btn.sm .ic{width:18px;height:18px}
.btn.wide{width:100%}
.link{color:var(--muted);font-size:14px}
.link:hover{color:var(--fg)}

/* feed */
.people-row{display:flex;gap:12px;overflow-x:auto;padding:14px 16px 8px;scrollbar-width:none}
.people-row::-webkit-scrollbar{display:none}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none;font-size:12px;color:var(--muted)}
.ring{padding:3px;border-radius:50%;background:conic-gradient(from 210deg,var(--accent),var(--accent-hi),var(--ember-deep),var(--accent));position:relative;display:block}
.ring .av{border:3px solid var(--bg);display:grid}
.ring.add{background:var(--line)}
.ring .plus{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2.5px solid var(--bg)}
.ring .plus .ic{width:14px;height:14px;stroke-width:3}
.person .n{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed{display:flex;flex-direction:column;padding:4px 0 28px}
.feed .post{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0}
.feed .post-h{padding:10px 8px 10px 14px}
.feed .post-b{padding:2px 14px 16px}
.detail{padding:12px 16px 28px}
.car{position:relative}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.car-track::-webkit-scrollbar{display:none}
.media .car-track img{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--on-scrim);opacity:.5;box-shadow:0 0 3px var(--black)}
.dots i.on{opacity:1;background:var(--accent)}
.count{position:absolute;top:12px;right:12px;background:var(--scrim);color:var(--on-scrim);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.car-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--scrim);color:var(--on-scrim);display:grid;place-items:center}
.car-nav.prev{left:10px}
.car-nav.next{right:10px}
.car-nav .ic{width:18px;height:18px}
.multi{position:absolute;top:8px;right:8px;background:var(--scrim);color:var(--on-scrim);font-size:11px;font-weight:700;padding:3px 8px 3px 5px;border-radius:999px;display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.multi .ic{width:13px;height:13px}
.picks{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 0;background:var(--black);scrollbar-width:none}
.picks::-webkit-scrollbar{display:none}
.pick{position:relative;flex:none;width:58px;height:58px;border-radius:13px;overflow:hidden;border:2.5px solid transparent}
.pick[aria-current="true"]{border-color:var(--accent)}
.pick .pk{display:block;width:100%;height:100%}
.pick .pk img{width:100%;height:100%;object-fit:cover;display:block}
.pick .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:var(--scrim);color:var(--on-scrim);display:grid;place-items:center;font-size:14px;line-height:1;font-weight:700}
.add-tile{flex:none;width:58px;height:58px;border-radius:13px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted)}
.add-tile .ic{width:20px;height:20px}
.add-tile:hover{border-color:var(--accent);color:var(--fg)}
.onb{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
.onb-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;margin:auto 0}
.onb-logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1}
.ph.big{width:54px;height:54px;font-size:25px;border-radius:16px}
.onb h1{font-family:var(--f-display);font-size:30px;line-height:1.12;margin:10px 0 0;letter-spacing:-.02em}
.onb h1 span{color:var(--muted);font-size:21px;font-weight:600}
.langs{display:grid;gap:10px}
.lang{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-size:18px}
.lang:hover{border-color:var(--accent)}
.lang small{color:var(--dim);font-size:13px}
.pform{display:flex;flex-direction:column;gap:14px}
.pf-av{align-self:center;position:relative;border-radius:50%}
.pf-cam{position:absolute;right:0;bottom:0;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:3px solid var(--bg)}
.pf-cam .ic{width:16px;height:16px}
.handle{display:flex;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding-left:14px}
.handle span{color:var(--muted);font-weight:700;font-size:16px}
.handle .field{border:0;background:transparent;padding-left:4px}
/* the frame belongs to the whole "@ + name" box, so the focus ring goes around the box, not around the inner input */
.handle:focus-within{border-color:var(--accent);outline:2px solid var(--accent-hi);outline-offset:2px}
.handle .field:focus-visible{outline:none}
.hint{font-weight:500;color:var(--dim);font-size:12px}
.hint.bad{color:var(--bad)}
.handle-t{color:var(--muted);font-weight:600;margin-top:-6px}
/* auth */
.onb .auth{width:100%;max-width:420px;min-height:100%;display:flex;flex-direction:column}
.auth-top{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:8px;margin:-8px 0 0 -10px}
.auth-prog{height:4px;border-radius:2px;background:var(--raise);overflow:hidden;margin-right:10px}
.auth-prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.auth-in{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px 0;min-width:0}
.auth-in.center{align-items:center}
.auth-hero{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px 0}
.auth-hero .onb-logo{font-size:42px}
.auth-hero .ph.big{width:66px;height:66px;font-size:30px;border-radius:20px}
.auth-tag{color:var(--muted);font-size:17px;max-width:30ch}
.auth-actions{display:flex;flex-direction:column;gap:10px}
.btn.xl{min-height:52px;font-size:16px;border-radius:16px}
.btn.danger{color:var(--bad)}
.link-b.danger{color:var(--bad)}
.btn.danger-fill{background:var(--bad);color:#fff}
.menu-list{display:flex;flex-direction:column;gap:8px;padding:8px 16px 16px}
.legal-links{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:13px}
.legal-links a,.legal-note a{color:var(--muted);text-decoration:underline}
.legal-note{margin:6px 0 0;line-height:1.45}
.blk-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.blk-row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.rep-th{width:84px;height:104px;border-radius:12px;overflow:hidden;background:var(--raise);display:grid;place-items:center}
.rep-th img,.rep-th video{width:100%;height:100%;object-fit:cover}
.rep-mid{display:flex;flex-direction:column;gap:4px;min-width:0}
.rep-btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.auth-foot{display:flex;justify-content:center;align-items:center;gap:6px;padding:16px 0 2px;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.link-b{color:var(--accent);font-weight:700;font-size:14px;padding:6px 4px}
.link-b.center{align-self:center}
.acct{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);text-align:left}
.acct:hover{border-color:var(--accent)}
.acct>span:not(.av){flex:1;min-width:0;display:flex;flex-direction:column}
.acct>.av{flex:none}
.acct b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct small{color:var(--dim);font-size:13px}
.auth-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--dim)}
.auth-note .ic{width:16px;height:16px;margin-top:1px}
.auth-form{display:flex;flex-direction:column;gap:14px}
.auth-step{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700}
.auth h1{font-family:var(--f-display);font-size:28px;line-height:1.15;margin:0;letter-spacing:-.02em}
.handle.big .field,.field.big{font-size:18px;min-height:52px}
.pf-av.xl{margin:6px 0}
.hint{display:flex;align-items:center;gap:6px;min-height:18px;margin:0}
.hint .ic{width:15px;height:15px}
.hint.ok{color:var(--ok)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* instagram-style profile */
.ig-top{display:flex;align-items:center;gap:18px;padding:16px 16px 10px}
.ig-stats{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;min-width:0}
.ig-stats b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.ig-stats span{font-size:13px;color:var(--muted)}
.ig-info{padding:0 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ig-name{font-size:15px;overflow-wrap:anywhere}
.ig-bio{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.ig-groups{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ig-groups .chip{max-width:100%}
.ig-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 4px}
.ig-btns .btn{width:100%;min-width:0;padding:0 8px;overflow:hidden;text-overflow:ellipsis}
.rank-card{display:flex;flex-direction:column;gap:8px;margin:10px 16px 2px;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;width:calc(100% - 32px)}
.rank-card:hover{border-color:var(--rc)}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rank-b{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:var(--rc);color:#1a110b;font-weight:800;font-size:13px;letter-spacing:.01em;white-space:nowrap}
.rc-avg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rc-bar{height:6px;border-radius:3px;background:var(--raise);overflow:hidden;display:block}
.rc-bar i{display:block;height:100%;background:var(--rc);border-radius:3px}
.rc-sub{font-size:12px;color:var(--dim)}
.rc-sub b{color:var(--fg)}
.hl-row{display:flex;gap:14px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;align-items:flex-start}
.hl-row::-webkit-scrollbar{display:none}
.hl{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;min-width:76px}
.hl.sm{min-width:60px}
.hl.sm .hl-l{font-size:11px;max-width:78px}
.hl.sm .hl-p{font-size:10px}
.hl.sm .rmd>i{font-size:10px;padding:0 5px;right:-9px}
.hl-row{align-items:flex-end}
/* placement medals (drawn by placeMedalSvg): the longer the period, the bigger and richer */
.pmd{position:relative;display:inline-block;width:var(--sz,66px);height:calc(var(--sz,66px)*1.133);flex:none;margin-bottom:4px}
.pmd svg{display:block;width:100%;height:100%;overflow:visible}
.pmd .pm-t{font-family:var(--f-display)}
.pmd.l1{--sz:66px}.pmd.l2{--sz:72px}.pmd.l3{--sz:80px}.pmd.l4{--sz:90px}.pmd.l5{--sz:100px}
.pmd.t1{--pg:rgba(255,200,61,.55)}.pmd.t2{--pg:rgba(211,216,224,.5)}.pmd.t3{--pg:rgba(214,143,82,.5)}.pmd.t10{--pg:rgba(116,80,58,.55)}
.pmd.l4{filter:drop-shadow(0 0 6px var(--pg))}.pmd.l5{filter:drop-shadow(0 0 11px var(--pg))}
.pmd.l5 .pm-rays{transform-origin:60px 58px;animation:mdspin 40s linear infinite}
.pmd>i{position:absolute;z-index:2;bottom:0;right:-4px;font-style:normal;font-size:11px;font-weight:800;background:var(--fg);color:var(--bg);padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums}
@keyframes mdspin{to{transform:rotate(360deg)}}
.hl-p{font-size:11px;color:var(--dim);white-space:nowrap}
.aw-row{display:grid;grid-template-columns:66px minmax(0,1fr);align-items:center;gap:14px}
.aw-row .pmd.pmd{--sz:62px;margin:0;justify-self:center}
.aw-row p span{white-space:nowrap}
.won{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 20px 18px}
.won .pmd.pmd{--sz:150px;margin-bottom:12px}
.ov{width:168px;height:168px;border-radius:20px;background:var(--black);image-rendering:pixelated;margin:4px auto 0;display:block}
.ov-key{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.ov-key i{width:10px;height:10px;border-radius:3px;display:block;margin-left:8px}.ov-key .k1{background:#c2560f;margin-left:0}.ov-key .k2{background:#f7ebde;border:1px solid var(--line)}.ov-key .k3{background:#ffc24a}
.mt{padding:16px;display:flex;flex-direction:column;gap:14px}
.mt-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt-slot{display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px;border-radius:18px;background:var(--surface);border:1.5px dashed var(--line);font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.mt-slot canvas{width:100%;aspect-ratio:1;border-radius:12px;background:var(--raise)}
.mt-res{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.mt-score{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.mt-score b{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.mt-score.hit{border-color:var(--accent)}.mt-score.hit b{color:var(--accent)}
.mt-tab{width:100%;border-collapse:collapse;font-size:14px}.mt-tab td{padding:7px 0;border-bottom:1px solid var(--line)}.mt-tab td.v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ai-why{display:flex;align-items:center;gap:8px;justify-content:center;font-size:14px;color:var(--fg);max-width:34ch}
.ai-tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:7px;background:var(--accent);color:var(--accent-ink)}
.dup-thumb{position:relative;width:132px;height:132px;border-radius:26px;overflow:hidden;background:var(--raise);margin-bottom:8px;display:grid;place-items:center}
.dup-thumb img,.dup-thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.6) brightness(.6)}
.dup-lock{position:relative;width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 18px var(--glow)}
.won h2{font-family:var(--f-display);font-size:30px;margin:0;letter-spacing:-.02em}
.won-t{font-size:18px;font-weight:700}
.won .btn{margin-top:12px}
.hl-ring.empty{width:58px;height:58px;border-radius:50%;margin-bottom:5px;background:none;border:2px dashed var(--line);display:grid;place-items:center;color:var(--dim)}
.hl-l{font-size:12px;font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.hl-hint{font-size:13px;color:var(--dim);align-self:center;flex:1;min-width:160px}
.ig-tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:12px}
.ig-tabs button{display:grid;place-items:center;padding:11px 0;color:var(--dim);border-bottom:2px solid transparent}
.ig-tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.grid.tall .tile{aspect-ratio:9/16}
.rmd{position:relative;display:inline-block;width:var(--sz,58px);height:calc(var(--sz,58px)*1.1);flex:none;margin-bottom:5px}
.rmd svg{display:block;width:100%;height:100%}
.rmd>i{position:absolute;z-index:2;bottom:-2px;right:-8px;font-style:normal;font-size:11px;font-weight:800;background:var(--fg);color:var(--bg);padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums}
.won .rmd.rmd{margin-bottom:12px}
.aw-h.pad{padding:0 16px;margin-top:12px}
.ranks-list{display:flex;flex-direction:column;gap:6px}
.rl-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;padding:7px 12px;border-radius:14px;background:var(--raise)}
.rl-row.cur{box-shadow:inset 0 0 0 2px var(--rc)}
.rl-row .rmd{margin:0}
.rl-t{display:flex;flex-direction:column;min-width:0}
.rl-n{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--accent);font-variant-numeric:tabular-nums}
.rl-min{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.pod-rank{font-size:11px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.post-h{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 12px;min-width:0}
.who-btn{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700}
.who-btn .who,.who-btn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.wild{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--raise);color:var(--accent-hi);white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis;flex:none}
.time{color:var(--dim);font-size:13px;white-space:nowrap}
.post-h .time{margin-left:auto}
.del.confirm{width:auto;padding:0 10px;background:var(--bad);color:var(--accent-ink);font-weight:700;font-size:13px}
.media{position:relative;background:var(--raise);touch-action:manipulation;user-select:none;-webkit-user-select:none;display:block;width:100%}
.media img,.media video{display:block;width:100%;max-width:100%;aspect-ratio:4/5;object-fit:cover}
img.broken{opacity:0}
.badge-reel{position:absolute;top:12px;right:12px;background:var(--scrim);color:var(--on-scrim);padding:5px 10px 5px 7px;border-radius:999px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.badge-reel .ic{width:16px;height:16px}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;color:var(--accent)}
.burst .ic{width:104px;height:104px;filter:drop-shadow(0 6px 24px var(--glow))}
.burst.go{animation:burst .85s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.12)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
.post-a{display:flex;align-items:center;gap:2px;padding:6px 6px 0}
.post-b{padding:2px 14px 14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.cap{overflow-wrap:anywhere;white-space:pre-wrap}

/* empty states */
.empty{margin:20px 16px;padding:30px 22px;border:1.5px dashed var(--line);border-radius:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--fg);font-size:22px;margin:0;letter-spacing:-.01em}
.empty p{max-width:34ch}
.empty .btn{margin-top:6px}
.empty.slim{border:0;margin:16px}
.lens{width:120px;height:120px;border-radius:50%;flex:none;background:radial-gradient(circle at 38% 34%,var(--accent-hi) 0 6%,var(--ember-deep) 7% 24%,var(--black) 25% 44%,var(--raise) 45% 62%,var(--line) 63% 100%);box-shadow:0 0 40px var(--glow)}
.lens.sm{width:72px;height:72px}

/* reels */
#v-reels{height:100%;position:relative;background:var(--black)}
html.dark-top #app::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--black);z-index:30}
.reel-list{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.reel-list::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:var(--black)}
.reel video{width:100%;height:100%;object-fit:cover;display:block;touch-action:manipulation}
.reel-shade{position:absolute;inset:0;background:linear-gradient(to top,var(--scrim-strong),transparent 42%),linear-gradient(to bottom,var(--scrim),transparent 20%);pointer-events:none}
.paused-ic{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .15s}
.paused-ic .ic{width:72px;height:72px;opacity:.85}
.reel.paused .paused-ic{opacity:1}
.reel-side{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:26px;display:flex;flex-direction:column;gap:16px;align-items:center}
.reel-side button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;min-width:48px;text-shadow:0 1px 4px var(--black)}
.reel-side .ic{width:32px;height:32px;filter:drop-shadow(0 1px 3px var(--black))}
.reel-side .on{color:var(--accent)}
.reel-side .del.confirm{background:var(--bad);color:var(--accent-ink);border-radius:10px;padding:6px 8px;text-shadow:none}
.reel-meta{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:84px;bottom:24px;display:flex;flex-direction:column;gap:8px;text-shadow:0 1px 4px var(--black)}
.reel-meta .cap{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.reels-top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 16px;pointer-events:none}
.reels-top>*{pointer-events:auto}
.reels-top h2{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.02em;text-shadow:0 1px 6px var(--black)}
.reel-empty{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.reel-empty .empty{margin:0;background:var(--bg)}
.reel .burst .ic{width:120px;height:120px}

/* pages */
.page{padding:16px 16px 32px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-size:30px;margin:0;letter-spacing:-.03em;line-height:1.1}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-top:10px}
.gcard{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.gmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.gmain .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.gmain b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.gmain .meta span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmain small{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}

/* leaderboard */
.wk{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lb-ctrl{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:3px}
.seg button{padding:7px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;padding-top:12px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .medal{padding:3px;border-radius:50%;display:block}
.pod .medal .av{border:3px solid var(--bg);display:grid}
.pod.p1 .medal{background:var(--gold);box-shadow:0 0 28px var(--glow)}
.pod.p2 .medal{background:var(--silver)}
.pod.p3 .medal{background:var(--bronze)}
.pod .name{font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pts{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pod .block{width:100%;border-radius:16px 16px 6px 6px;background:var(--surface);border:1px solid var(--line);display:flex;justify-content:center;padding-top:10px;font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--muted)}
.pod.p1 .block{height:118px;background:linear-gradient(180deg,var(--accent),var(--ember-deep));color:var(--accent-ink);border:0}
.pod.p2 .block{height:88px}
.pod.p3 .block{height:66px}
.ranks{display:flex;flex-direction:column;gap:2px}
.rank-row{display:grid;grid-template-columns:26px auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;width:100%}
.rank-row:hover{background:var(--surface)}
.rank-row.me{background:var(--raise);box-shadow:inset 0 0 0 1px var(--accent)}
.rank-row .n{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:700;text-align:center}
.rank-row .who{min-width:0;display:flex;flex-direction:column}
.rank-row .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .pts{font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.rank-row .pts small{font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--dim);margin-left:3px}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:8px}
.rules h3{font-family:var(--f-display);font-size:18px;margin:0 0 6px}
.rules table{width:100%;border-collapse:collapse;font-size:14px}
.rules td{padding:7px 0;border-bottom:1px solid var(--line)}
.rules tr:last-child td{border-bottom:0}
.rules td.v{text-align:right;color:var(--accent-hi);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rules p{font-size:13px;color:var(--dim);margin-top:8px}
.rules p.rl{color:var(--muted);font-size:14px;margin:0 0 6px}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none}
.scope{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scope button{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.scope button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prev-win{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.prev-win .ic{color:var(--gold);width:22px;height:22px}
.prev-win b{color:var(--fg)}
.awards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:440px}
.aw{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-align:left}
.aw .medal-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--accent-ink);flex:none}
.aw .medal-ic .ic{width:17px;height:17px}
.aw b{display:block;font-size:13px;line-height:1.2}
.aw small{font-size:11px;color:var(--dim)}
.aw.day .medal-ic{background:var(--accent)}
.aw.week .medal-ic{background:var(--bronze)}
.aw.month .medal-ic{background:var(--silver)}
.aw.year .medal-ic,.aw.all .medal-ic{background:var(--gold)}
.aw.all{box-shadow:0 0 0 1px var(--gold),0 0 18px var(--glow)}
.aw-h{margin:8px 0 0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.gmain .meta span.un{color:var(--fg);font-weight:600}
.gmain .udot{flex:none}

/* layers + sheets */
#layers{position:relative;z-index:40}
html.kb .layer,html.kb .onb,html.kb .sheet-wrap{top:var(--vvt,0px);bottom:auto;height:var(--vvh,100%)}
html.kb .sheet-wrap{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
html.kb .sheet{max-height:100%;padding-bottom:0}
html.kb .csheet{height:100%}
.layer{position:fixed;inset:0;margin-inline:auto;max-width:560px;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slidein .2s ease-out}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.l-head{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 4px;border-bottom:1px solid var(--line);min-height:57px;padding-left:max(4px,env(safe-area-inset-left,0px))}
.l-head h2{font-family:var(--f-display);font-size:20px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.l-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.sheet-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:86%;background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px)}}
.sheet .l-head{border-bottom-color:var(--line);min-height:50px;padding-left:16px}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-form{padding:16px;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* inputs */
.field{width:100%;background:var(--raise);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;resize:none}
.field::placeholder{color:var(--dim)}
.field:focus{border-color:var(--accent)}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.composer{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet .composer{background:var(--surface)}
.composer .field{height:44px;padding:0 16px;border-radius:22px;min-width:0;flex:1}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:hover{background:var(--accent-hi)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:12px;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.note{padding:14px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px}

/* comments */
.cmt{display:flex;gap:10px;padding:10px 16px;align-items:flex-start}
.cmt p{overflow-wrap:anywhere}
.cmt .time{font-size:12px}
.csheet{height:76%;max-height:none}
.c-head{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;padding:2px 6px 6px;border-bottom:1px solid var(--line)}
.c-head h2{text-align:center;font-size:15px;font-weight:700;margin:0}
.cm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:10px 10px 4px 16px;align-items:start}
.cm.rep{padding-left:62px}
.cm .nm{font-size:13px;font-weight:700;color:var(--muted)}
.by{font-size:10px;background:var(--raise);color:var(--accent-hi);padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:700;vertical-align:1px}
.cm .tx{overflow-wrap:anywhere;white-space:pre-wrap;margin-top:1px}
.cm .meta{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:4px;font-weight:600}
.cm .meta button:hover{color:var(--fg)}
.cm .lk{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--dim);padding:4px 2px 0;min-width:32px;font-variant-numeric:tabular-nums}
.cm .lk .ic{width:18px;height:18px}
.cm .lk.on{color:var(--accent)}
.emojis{display:flex;justify-content:space-between;gap:2px;padding:8px 12px 0;border-top:1px solid var(--line);font-size:24px}
.emojis button{padding:4px 5px;border-radius:10px;line-height:1}
.emojis button:hover{background:var(--raise)}
.replying{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 16px;font-size:13px;color:var(--muted);background:var(--raise)}
.sheet .composer{border-top:0}

/* chat */
.chat-who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.chat-who span{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.chat-who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.chat-who small{color:var(--dim);font-size:12px}
.msgs{display:flex;flex-direction:column;gap:3px;padding:14px 12px}
.daysep{align-self:center;font-size:12px;color:var(--dim);margin:14px 0 6px;font-weight:700;letter-spacing:.04em}
.m{display:flex;gap:8px;align-items:flex-end;max-width:84%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m.gap{margin-top:8px}
.avsp{width:28px;flex:none}
.bub{padding:8px 12px;border-radius:18px;background:var(--raise);overflow-wrap:anywhere;white-space:pre-wrap}
.m.me .bub{background:var(--accent);color:var(--accent-ink)}
.bub img{display:block;max-width:min(240px,100%);border-radius:12px;margin:2px 0 4px}
.bt{font-size:10.5px;opacity:.65;margin-left:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.from{font-size:12px;color:var(--muted);margin:0 0 2px 6px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%}
.row:hover{background:var(--surface)}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.row .mid b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span.un{color:var(--fg);font-weight:600}
.row .side{font-size:12px;color:var(--dim);display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.udot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:block}

/* camera */
.layer.cam{background:var(--black)}
.cam .l-head{border-bottom:0;justify-content:space-between}
.cam-view{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;margin:0 10px;border-radius:24px;background:var(--surface)}
.cam-view video.live{width:100%;height:100%;object-fit:cover}
.cam-view video.live.mirror{transform:scaleX(-1)}
.cam-fallback{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px;max-width:340px;color:var(--muted)}
.cam-fallback h3{font-family:var(--f-display);font-size:24px;color:var(--fg);margin:6px 0 0}
.cam-bar{display:flex;align-items:center;justify-content:space-around;padding:18px 16px 22px}
.shutter-big{width:80px;height:80px;border-radius:50%;border:4px solid var(--fg);display:grid;place-items:center}
.shutter-big::after{content:"";width:62px;height:62px;border-radius:50%;background:var(--fg);transition:transform .1s}
.shutter-big.rec::after{background:var(--accent);width:56px;height:56px}
.shutter-big:active::after{transform:scale(.88)}
.shutter-big:disabled{opacity:.35}
.shutter-big.recording{border-color:var(--bad)}
.shutter-big.recording::after{width:32px;height:32px;border-radius:9px;background:var(--bad)}
.rec-time{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;background:var(--bad);color:#fff;font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.mode{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px}
.mode button{padding:7px 16px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.edit-prev{flex:1;min-height:120px;display:grid;place-items:center;padding:10px 16px;background:var(--black)}
.edit-prev img,.edit-prev video{max-width:100%;max-height:100%;border-radius:18px;object-fit:contain;min-height:0}
.hu-note{margin:0;padding:8px 16px 0;font-size:13px;color:var(--muted);background:var(--black)}
.hu-note.yes{color:var(--accent-hi)}
.fx-strip{display:flex;gap:10px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;background:var(--black)}
.fx-strip::-webkit-scrollbar{display:none}
.fx{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.fx img,.fx .fx-sw{width:62px;height:62px;object-fit:cover;border-radius:15px;border:2.5px solid transparent;display:block}
.fx .fx-sw{background:linear-gradient(135deg,var(--accent-hi),var(--ember-deep) 55%,var(--black))}
.fx[aria-pressed="true"]{color:var(--accent)}
.fx[aria-pressed="true"] img,.fx[aria-pressed="true"] .fx-sw{border-color:var(--accent)}
.edit-form{padding:6px 16px 14px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-top:1px solid var(--line)}
.edit-form .row2{display:flex;gap:10px;align-items:center}

/* profile + group */
.prof-top{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px 10px;text-align:center}
.prof-top h3{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.02em}
.prof-top .bio{max-width:36ch;color:var(--muted);overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:380px;margin:6px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 6px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:10px 0 24px}
.tile{position:relative;aspect-ratio:1;background:var(--raise);overflow:hidden;display:block;width:100%}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .ic{position:absolute;top:7px;right:7px;width:20px;height:20px;filter:drop-shadow(0 1px 3px var(--black))}
.sub-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.sub-h h4{margin:0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.ghero{padding:22px 16px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:linear-gradient(165deg,var(--gc) -60%,var(--bg) 72%)}
.ghero h3{font-family:var(--f-display);font-size:30px;margin:4px 0 0;letter-spacing:-.03em;line-height:1.05;overflow-wrap:anywhere}
.ghero p{color:var(--muted);overflow-wrap:anywhere}
.ghero .btn-row{justify-content:flex-start;margin-top:4px}
.mem-row{display:flex;gap:10px;overflow-x:auto;padding:6px 16px 4px;scrollbar-width:none}
.mem-row .person{width:58px}
.pad{padding:0 16px}
.ranks.pad{padding:0 4px}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:13px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:100;width:max-content;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

const THEMES={auto:['auto','Automatikus téma'],light:['sun','Világos téma'],dark:['moon','Sötét téma']};
let theme=(()=>{ try{ const t=localStorage.getItem('pz_theme'); return THEMES[t]?t:'auto'; }catch{ return 'auto'; } })();
function applyTheme(){ const r=document.documentElement; r.classList.toggle('t-light',theme==='light'); r.classList.toggle('t-dark',theme==='dark'); syncStatusBar(); }
/* in the packaged app the system status bar icons have to follow the theme (dark icons on the white theme, light on the brown) */
if(window.visualViewport){
  const vv=window.visualViewport, root=document.documentElement; let raf=0;
  const sync=()=>{ raf=0; const open=window.innerHeight-vv.height>120; root.classList.toggle('kb',open); if(open){ root.style.setProperty('--vvt',vv.offsetTop+'px'); root.style.setProperty('--vvh',vv.height+'px'); } };
  const later=()=>{ if(!raf) raf=requestAnimationFrame(sync); };
  vv.addEventListener('resize',later); vv.addEventListener('scroll',later);
}
/* iPhone: dragging a sheet (comments, menus) on a part that does not scroll moved the whole page, worst with the keyboard
   open, and the sheet stayed shifted. Inside a sheet only a list that can really scroll may move; everything else stays put.
   When the keyboard closes the page is put back to the top, where Safari sometimes leaves it scrolled. */
document.addEventListener('touchmove',e=>{
  const t=e.target; if(!(t instanceof Element)||!t.closest('.sheet-wrap')||e.touches.length>1) return;
  for(let el=t;el&&!el.classList.contains('sheet-wrap');el=el.parentElement){
    const cs=getComputedStyle(el);
    if(/(auto|scroll)/.test(cs.overflowY)&&el.scrollHeight>el.clientHeight+1) return;
    if(/(auto|scroll)/.test(cs.overflowX)&&el.scrollWidth>el.clientWidth+1) return;
  }
  if(e.cancelable) e.preventDefault();
},{passive:false});
document.addEventListener('focusout',()=>setTimeout(()=>{ const a=document.activeElement; if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ if(window.scrollY||document.documentElement.scrollTop) window.scrollTo(0,0); } },120));
function syncStatusBar(){ try{ const top=typeof S!=='undefined'&&S.stack.length?S.stack[S.stack.length-1].type:'', reels=typeof S!=='undefined'&&!S.stack.length&&S.tab==='reels', onDark=top==='camera'||reels;
  document.documentElement.classList.toggle('dark-top',reels);   // the strip behind the status bar goes dark together with the reels screen
  const sb=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.StatusBar; if(!sb) return; const dark=onDark||theme==='dark'||(theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches); sb.setStyle({style:dark?'DARK':'LIGHT'}).catch(()=>{}); }catch{} }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>syncStatusBar()); }catch{}

/* Shape check (PoopMatch, source in match.js): the same subject photographed again - rotated, tilted, zoomed, re-lit, mirrored.

   - looksLikePoop: the recognizer found a subject and its colour is brownish, yellowish or dark. On its own this only stops

   - toilet picture (sceneOf(...).toilet): a good part of the photo is smooth, bright porcelain. Posts made in a toilet count as

/* PoopNet (poopnet.js, weights in poopnet.bin): a small picture classifier that runs on the device. Its weights file sits

function loadNet(){

async function toJpeg(file,max=1440){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image(); img.src=url; await img.decode();
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.86));
  } finally { URL.revokeObjectURL(url); }
}

function updateCard(el,p){
  const n=likeCount(p), on=liked(p), c=cmts(p).length; const lb=el.querySelector('.like-btn');

function syncKeyed(list,items,map,make,update){
  const seen=new Set(); let prev=null;
  for(const p of items){
    seen.add(p.id); let el=map.get(p.id); const sig=baseSig(p);
    if(!el||el.dataset.sig!==sig){ const n=make(p); n.dataset.sig=sig; if(el){ el.replaceWith(n); if(reelIO&&map===reelEls){ reelIO.unobserve(el); } } map.set(p.id,n); el=n; }
    else update(el,p);

}

/* reels inside the home feed play by themselves, muted, while most of them is on screen; a tap opens the Reels tab */
let feedIO=null;
const feedOn=()=>S.tab==='feed'&&!S.stack.length&&!document.hidden;
function watchFeed(){
  if(!feedIO) feedIO=new IntersectionObserver(es=>es.forEach(en=>{ const v=en.target; if(en.intersectionRatio>.6&&feedOn()) v.play().catch(()=>{}); else v.pause(); }),{threshold:[0,.6,1]});
  for(const el of feedEls.values()){ const v=el.querySelector('video'); if(v&&!v.dataset.io){ v.dataset.io='1'; feedIO.observe(v); } }
}
function pauseFeed(){ for(const el of feedEls.values()){ const v=el.querySelector('video'); if(v) v.pause(); } }
function playFeed(){
  if(!feedOn()) return;
  for(const el of feedEls.values()){ const v=el.querySelector('video'); if(!v) continue; const b=v.getBoundingClientRect(), seen=Math.max(0,Math.min(b.bottom,innerHeight)-Math.max(b.top,0)); if(b.height&&seen/b.height>.6) v.play().catch(()=>{}); else v.pause(); }
}

const head=(title,extra='')=>`<div class="l-head"><button class="icon-btn" data-act="back" aria-label="Vissza">${ic('back')}</button><h2>${h(title)}</h2>${extra}</div>`;

const QUICK=['💩','😂','🔥','😍','👏','🤢','😮','🙌'];
function L_comments(pid){
  let replyTo=null, busy=false, scrollEnd=false;
  const el=mkSheet(`<div class="grab"></div><div class="c-head"><span></span><h2 id="ch">Hozzászólások</h2><button class="icon-btn" data-act="back" aria-label="Bezárás">${ic('close')}</button></div>
  <div class="l-body" id="cl"></div><div class="replying" id="rp" hidden></div>
  <div class="emojis" role="group" aria-label="Gyors emojik">${QUICK.map(e=>`<button type="button" data-e="${e}" aria-label="${e} beszúrása">${e}</button>`).join('')}</div>
  <form class="composer" id="cf">${av(S.uid,32)}<input class="field" id="ci" maxlength="500" placeholder="Írj hozzászólást…" autocomplete="off" autofocus><button class="send" aria-label="Küldés">${ic('send')}</button></form>`);
  el.querySelector('.sheet').classList.add('csheet');
  const input=el.querySelector('#ci'), list=el.querySelector('#cl'), rp=el.querySelector('#rp');
  const cLikes=c=>Object.entries(c.likes&&typeof c.likes==='object'?c.likes:{}).filter(([,v])=>typeof v==='number'&&v>0);
  function row(c,rep,p){
    const lk=cLikes(c); const on=!!S.uid&&lk.some(([k])=>k===S.uid); const canDel=c.a===S.uid||S.isOwner||p.author===S.uid;
    return `<div class="cm ${rep?'rep':''}"><button data-act="profile" data-uid="${h(c.a)}" aria-label="${h(nm(c.a))} profilja">${av(c.a,rep?28:36)}</button>
    <div><div class="nm">${h(nm(c.a))}${c.a===p.author?'<span class="by">Szerző</span>':''}</div><p class="tx">${h(str(c.t,500))}</p>
    <div class="meta"><span>${ago(c.at)}</span><button type="button" data-c="reply" data-id="${h(c.id)}">Válasz</button>${canDel?`<button type="button" data-c="del" data-id="${h(c.id)}">Törlés</button>`:''}</div></div>
    <button type="button" class="lk ${on?'on':''}" data-c="like" data-id="${h(c.id)}" aria-pressed="${on}" aria-label="${on?'Nem tetszik többé':'Tetszik'}">${ic('heart',on?'fill':'')}<span>${lk.length||''}</span></button></div>`;
  }
  function clearReply(){ replyTo=null; rp.hidden=true; rp.innerHTML=''; }
  const L={type:'comments',el,refresh(){
    const p=S.posts.find(x=>x.id===pid);
    if(!p){ list.innerHTML='<div class="empty slim"><p>Ez a poszt már nem elérhető.</p></div>'; return; }
    const cs=cmts(p).filter(c=>!isBlocked(c.a)); el.querySelector('#ch').textContent=cs.length?cs.length+' hozzászólás':'Hozzászólások';
    const ids=new Set(cs.map(c=>c.id)); const top=cs.filter(c=>!(typeof c.p==='string'&&ids.has(c.p)));
    list.innerHTML=cs.length?top.map(c=>row(c,false,p)+cs.filter(x=>x.p===c.id).map(x=>row(x,true,p)).join('')).join(''):'<div class="empty slim"><h3>Még nincs hozzászólás</h3><p>Írd meg az elsőt, vagy dobj be egy emojit.</p></div>';
    if(scrollEnd){ list.scrollTop=list.scrollHeight; scrollEnd=false; }
  }};
  el.addEventListener('click',async e=>{
    const eb=e.target.closest('[data-e]'); if(eb){ const pos=input.selectionStart??input.value.length; input.value=(input.value.slice(0,pos)+eb.dataset.e+input.value.slice(pos)).slice(0,500); input.focus(); return; }
    const b=e.target.closest('[data-c]'); if(!b) return; const c=b.dataset.c;
    if(c==='noreply'){ clearReply(); return; }
    const p=S.posts.find(x=>x.id===pid); if(!p) return; const cs=cmts(p); const cm=cs.find(x=>x.id===b.dataset.id); if(!cm) return;
    if(c==='reply'){
      const parent=typeof cm.p==='string'&&cs.some(x=>x.id===cm.p)?cm.p:cm.id; replyTo={id:parent};
      rp.hidden=false; rp.innerHTML=`<span>Válasz neki: <b>${h(nm(cm.a))}</b></span><button type="button" class="icon-btn" data-c="noreply" aria-label="Válasz megszakítása">${ic('close')}</button>`;
      if(!input.value.trim()) input.value='@'+nm(cm.a)+' '; input.focus();
    } else if(c==='like'){
      if(!S.uid) return needId(); if(busy) return; busy=true; const on=cLikes(cm).some(([k])=>k===S.uid);
      await w(()=>S.db.doc('posts/'+pid).update({comments:{[cm.id]:{likes:{[S.uid]:on?0:now()}}}})); busy=false;
    } else if(c==='del'){
      if(b.dataset.confirm){ await w(()=>S.db.doc('posts/'+pid).update({comments:{[cm.id]:{d:true,t:''}}})); }
      else { b.dataset.confirm='1'; b.textContent='Biztos törlöd?'; b.style.color='var(--bad)'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.confirm; b.textContent='Törlés'; b.style.color=''; } },3500); }
    }
  });
  el.querySelector('#cf').addEventListener('submit',async e=>{ e.preventDefault(); const t=input.value.trim(); if(!t) return; input.value='';
    const data={a:S.uid,t:t.slice(0,500),at:now()}; if(replyTo) data.p=replyTo.id; else scrollEnd=true;
    const ok=await w(()=>S.db.doc('posts/'+pid).update({comments:{[newId()]:data}})); if(ok) clearReply(); else input.value=t; });
  return L;
}

function L_post(pid){
  const el=mkLayer(head('Poszt')+'<div class="l-body"><div class="detail" id="pp"></div></div>');
  let card=null;
  return {type:'post',pid,el,refresh(){ const p=S.posts.find(x=>x.id===pid); const box=el.querySelector('#pp');
    if(!p||!validPost(p)){ box.innerHTML='<div class="empty"><h3>Ez a poszt már nem elérhető</h3></div>'; card=null; return; }
    if(!card||card.dataset.sig!==baseSig(p)){ card=postCard(p); box.replaceChildren(card); } else updateCard(card,p); }};
}

    el.querySelector('#ph').textContent=handleOf(uid)?'@'+handleOf(uid):nm(uid);

    const ps=okPosts().filter(p=>p.author===uid); const all=ranking(0,null); const idx=all.findIndex(r=>r.id===uid); const me=all[idx]||{likes:0};
    const bio=str((S.people[uid]||{}).bio,160); const gs=S.groups.filter(g=>members(g).includes(uid));

    const list=ps.filter(p=>tab==='reels'?p.kind==='reel':p.kind!=='reel');
    el.querySelector('#pb').innerHTML=`<section class="ig-top">${av(uid,86)}<div class="ig-stats"><div><b>${ps.length}</b><span>Posztok</span></div><div><b>${me.likes}</b><span>Like</span></div><div><b>${idx>=0&&me.likes>0?'#'+(idx+1):'–'}</b><span>Helyezés</span></div></div></section>
    <section class="ig-info"><b class="ig-name">${h(nm(uid))}</b>${bio?`<p class="ig-bio">${h(bio)}</p>`:(own?'<p class="ig-bio dim">Még nincs bemutatkozásod.</p>':'')}${gs.length?`<div class="ig-groups">${gs.map(g=>`<button class="chip" data-act="group" data-gid="${h(g.id)}">${h(str(g.name,40))}</button>`).join('')}</div>`:''}</section>
    <div class="ig-btns">${own?`<button class="btn sm ghost" data-act="editprof">Profil szerkesztése</button><button class="btn sm ghost" data-act="shareprof">Profil megosztása</button>`:`<button class="btn sm" data-act="dm" data-uid="${h(uid)}">Üzenet</button><button class="btn sm ghost" data-act="shareprof" data-uid="${h(uid)}">Profil megosztása</button><button class="btn sm ghost" data-act="block" data-uid="${h(uid)}" aria-label="Letiltás">${ic('more')}</button>`}</div>
    <button class="rank-card" data-act="ranks" data-uid="${h(uid)}" style="--rc:${ro.r.c}"><span class="rc-top"><span class="rank-b" data-noi18n>${ro.r.n}</span><span class="rc-avg"><span>${fmtAvg(ro.avg)} poszt/nap</span> · <span>${ro.today} ma</span></span></span><span class="rc-bar"><i style="width:${pct}%"></i></span><span class="rc-sub">${ro.next?`<span>Következő:</span> <b data-noi18n>${ro.next.n}</b> <span>· még ${need} poszt kell</span>`:'<span>Elérted a legmagasabb rangot!</span>'}</span></button>
    ${rewardsRow(uid,own)}
    ${rankBadgesRow(uid,own)}
    <div class="ig-tabs" role="tablist"><button role="tab" data-ptab="grid" aria-selected="${tab==='grid'}" aria-label="Fotók">${ic('grid')}</button><button role="tab" data-ptab="reels" aria-selected="${tab==='reels'}" aria-label="Reelek">${ic('reels')}</button></div>
    ${list.length?`<div class="grid ${tab==='reels'?'tall':''}">${list.map(tile).join('')}</div>`:`<div class="empty slim"><h3>${tab==='reels'?'Még nincs reel':'Még nincs poszt'}</h3>${own?`<button class="btn sm" data-act="camera"${tab==='reels'?' data-mode="reel"':''}>${ic('camera')}${tab==='reels'?'Reel felvétele':'Új poszt'}</button>`:''}</div>`}`;
  }};
  return L;

    el.querySelector('.l-head h2').textContent=str(g.name,40);

function L_chat(cid){
  const el=mkLayer(`<div class="l-head"><button class="icon-btn" data-act="back" aria-label="Vissza">${ic('back')}</button><button class="chat-who" id="cw"></button><button class="icon-btn" id="ginfo" data-act="group" aria-label="Csoport adatai" hidden>${ic('groups')}</button></div>
  <div class="l-body" id="mb"><div class="msgs" id="ml"></div></div>
  <div class="note" id="mn" hidden></div>
  <form class="composer" id="mf"><button type="button" class="icon-btn" id="mp" aria-label="Fotó küldése">${ic('camera')}</button><input class="field" id="mi" maxlength="1000" placeholder="Üzenet…" autocomplete="off" autofocus><button class="send" aria-label="Küldés">${ic('send')}</button></form>`);
  let msgs=[], unsub=null, q=Promise.resolve(), first=true, timer=null;
  const box=el.querySelector('#mb');
  function renderMsgs(){
    const info=chatInfo(cid); const near=first||box.scrollHeight-box.scrollTop-box.clientHeight<140; const list=el.querySelector('#ml');
    if(!msgs.length){ list.innerHTML=`<div class="empty slim">${info.kind==='g'?gbadge(info.g,64):av(info.other,64)}<h3>${h(info.title)}</h3><p>${S.ready||!S.db?'Még nincs üzenet. Köszönj be!':'Üzenetek betöltése…'}</p></div>`; return; }
    let html='',lastDay='',lastA='';
    for(const m of msgs){ const d=dayKey(m.at); if(d!==lastDay){ html+=`<div class="daysep">${h(dayLabel(m.at))}</div>`; lastDay=d; lastA=''; }
      const me=m.a===S.uid, start=m.a!==lastA;
      html+=`<div class="m ${me?'me':''} ${start?'gap':''}">${me?'':(start?`<button data-act="profile" data-uid="${h(m.a)}" aria-label="${h(nm(m.a))} profilja">${av(m.a,28)}</button>`:'<span class="avsp"></span>')}<div>${!me&&start&&info.kind==='g'?`<div class="from">${h(nm(m.a))}</div>`:''}<div class="bub">${isAsset(m.img)?`<img src="${blobUrl(m.img)}" alt="Fotó">`:''}${m.t?h(str(m.t,1000)):''}<span class="bt">${hhmm(m.at)}</span></div></div></div>`;
      lastA=m.a; }
    list.innerHTML=html; if(near) box.scrollTop=box.scrollHeight; first=false;
  }
  el.querySelector('#ml').addEventListener('load',()=>{ if(box.scrollHeight-box.scrollTop-box.clientHeight<400) box.scrollTop=box.scrollHeight; },true);
  const L={type:'chat',cid,el,refresh(){
    const info=chatInfo(cid); const cw=el.querySelector('#cw');
    cw.innerHTML=(info.kind==='g'?gbadge(info.g,40):av(info.other,40))+`<span><b>${h(info.title)}</b><small>${h(info.sub)}</small></span>`;
    if(info.kind==='g'){ cw.dataset.act='group'; cw.dataset.gid=info.g?info.g.id:''; } else { cw.dataset.act='profile'; cw.dataset.uid=info.other; }
    const gi=el.querySelector('#ginfo'); gi.hidden=!(info.kind==='g'&&info.g); if(info.g) gi.dataset.gid=info.g.id;
    const can=!!S.uid&&(info.kind==='d'?info.members.includes(S.uid):isMember(info.g));
    el.querySelector('#mf').hidden=!can; const note=el.querySelector('#mn'); note.hidden=can;
    if(!can) note.innerHTML=info.kind==='g'&&info.g&&S.uid?`<span>Csatlakozz a csoporthoz, hogy írhass.</span><button class="btn sm" data-act="join" data-gid="${h(info.g.id)}">Csatlakozom</button>`:'<span>Ebbe a beszélgetésbe nem tudsz írni.</span>';
    markSeen(cid); renderMsgs();
  },close(){ if(unsub) unsub(); clearTimeout(timer); }};
  if(S.db){
    try{
      timer=setTimeout(()=>{ if(first) toast('Az üzenetek lassan töltődnek…'); },10000);
      unsub=S.db.collection(`chats/${cid}/days`).orderBy('day','desc').limit(7).onSnapshot(s=>{
        if(!s.metadata.fromCache) clearTimeout(timer);
        const all=[]; s.docs.forEach(d=>{ const ms=(d.data()||{}).msgs; if(!ms||typeof ms!=='object') return; for(const [id,m] of Object.entries(ms)) if(m&&typeof m.a==='string'&&typeof m.at==='number'&&(typeof m.t==='string'||isAsset(m.img))) all.push({id,...m}); });

/* camera */
function L_camera(opts={}){
  const st={mode:opts.mode==='reel'?'reel':'photo',facing:'environment',stream:null,live:false,blob:null,url:null,items:[],sel:0,kind:'photo',filter:'none',group:opts.group||'',busy:false,step:'shoot',starting:true};
  const el=mkLayer('','cam');
  const REC_MAX=20;
  const stop=()=>{ if(st.rec&&st.rec.state!=='inactive'){ st.cancelRec=true; try{ st.rec.stop(); }catch{} } clearInterval(st.recT); if(st.stream) st.stream.getTracks().forEach(t=>t.stop()); st.stream=null; };
  const resetMedia=()=>{ if(st.url) URL.revokeObjectURL(st.url); st.items.forEach(x=>URL.revokeObjectURL(x.url)); st.items=[]; st.sel=0; st.url=null; st.blob=null; st.vt=null; st.filter='none'; };
  async function startLive(){
    stop(); st.live=false; st.starting=true; if(st.step==='shoot') draw();
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      const reel=st.mode==='reel', video={facingMode:st.facing,width:{ideal:reel?1280:1920},height:{ideal:reel?720:1440}};
      try{ st.stream=await navigator.mediaDevices.getUserMedia({video,audio:reel}); st.live=true; }
      catch{ if(reel){ try{ st.stream=await navigator.mediaDevices.getUserMedia({video,audio:false}); st.live=true; }catch{ st.live=false; } } }
    }
    st.starting=false; if(st.step==='shoot') draw();
  }
  /* reel recording inside the app: tap to start, tap to stop, ends by itself after REC_MAX seconds */
  function toggleRec(){
    if(st.rec&&st.rec.state==='recording'){ st.rec.stop(); return; }
    const types=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mime=types.find(t=>{ try{ return MediaRecorder.isTypeSupported(t); }catch{ return false; } })||'';
    let rec; try{ rec=new MediaRecorder(st.stream,Object.assign({videoBitsPerSecond:2500000,audioBitsPerSecond:96000},mime?{mimeType:mime}:{})); }catch{ toast('A felvétel ezen az eszközön nem működik.'); return; }
    const chunks=[]; st.rec=rec; st.cancelRec=false; st.recStart=now();
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{
      clearInterval(st.recT); st.rec=null; const b=el.querySelector('[data-c="shoot"]'); if(b) b.classList.remove('recording'); const tm=el.querySelector('#rect'); if(tm) tm.hidden=true;
      if(st.cancelRec||!chunks.length) return;
      const type=(rec.mimeType||mime||'video/webm').split(';')[0]; const rf=new File([new Blob(chunks,{type})],'reel.'+(type.indexOf('mp4')>=0?'mp4':'webm'),{type}); gotReel(rf);
    };
    try{ rec.start(500); }catch{ st.rec=null; toast('A felvétel ezen az eszközön nem működik.'); return; }
    const btn=el.querySelector('[data-c="shoot"]'), tm=el.querySelector('#rect'); if(btn){ btn.classList.add('recording'); btn.setAttribute('aria-label','Felvétel leállítása'); } if(tm) tm.hidden=false;
    const tick=()=>{ const sec=(now()-st.recStart)/1000; if(tm) tm.textContent='0:'+String(Math.min(REC_MAX,Math.floor(sec))).padStart(2,'0')+' / 0:'+REC_MAX; if(sec>=REC_MAX&&rec.state==='recording') rec.stop(); };
    tick(); st.recT=setInterval(tick,200);
  }
  function draw(){ st.step==='shoot'?drawShoot():drawEdit(); }
  /* the only way to make a post: the live camera of the app. No gallery, no file picking. A shot is never posted by
     itself: it lands on the edit screen, where the Share button posts it. */
  function drawShoot(){
    const more=st.items.length>0;
    el.innerHTML=`<div class="l-head"><button class="icon-btn" data-act="back" aria-label="Bezárás">${ic('close')}</button>${more?'<h2>Még egy kép</h2>':`<div class="mode" role="group" aria-label="Mód"><button data-c="mode" data-v="photo" aria-pressed="${st.mode==='photo'}">Fotó</button><button data-c="mode" data-v="reel" aria-pressed="${st.mode==='reel'}">Reel</button></div>`}<span class="icon-btn" aria-hidden="true"></span></div>
    <div class="cam-view"><span class="rec-time" id="rect" data-noi18n hidden></span>${st.live?`<video class="live ${st.facing==='user'?'mirror':''}" autoplay playsinline muted></video>`:st.starting?'<div class="cam-fallback"><div class="lens"></div><p>Kamera indítása…</p></div>':'<div class="cam-fallback"><div class="lens"></div><h3>A kamera nem érhető el</h3><p>Posztolni csak az app saját kamerájával lehet. Engedélyezd a kamerát, aztán próbáld újra.</p><button class="btn" data-c="retry">Újra</button></div>'}</div>
    <div class="cam-bar">${more?`<button class="icon-btn lg" data-c="toedit" aria-label="Vissza a poszthoz">${ic('back')}</button>`:'<span class="icon-btn lg" aria-hidden="true"></span>'}<button class="shutter-big ${st.mode==='reel'?'rec':''}" data-c="shoot" aria-label="${st.mode==='reel'?'Videó felvétele':'Fotó készítése'}" ${st.live?'':'disabled'}></button><button class="icon-btn lg" data-c="flip" aria-label="Kamera váltása" ${st.live?'':'disabled'}>${ic('flip')}</button></div>`;
    if(st.live){ const v=el.querySelector('video.live'); v.srcObject=st.stream; v.play().catch(()=>{}); }
  }
  function drawEdit(){
    const myGroups=S.groups.filter(isMember);
    const oldCap=(el.querySelector('#cap')||{}).value||''; const oldDest=(el.querySelector('#dest')||{}).value;
    const cur=st.kind==='reel'?st.url:((st.items[st.sel]||st.items[0]||{}).url||''); const first=(st.items[0]||{}).url||'';
    el.innerHTML=`<div class="l-head"><button class="icon-btn" data-c="retake" aria-label="Új felvétel">${ic('back')}</button><h2>${st.kind==='reel'?'Új reel':'Új poszt'+(st.items.length>1?' · '+st.items.length+' kép':'')}</h2></div>
    <div class="edit-prev">${st.kind==='reel'?`<video src="${cur}" autoplay loop muted playsinline id="pv"></video>`:`<img src="${cur}" alt="Előnézet" id="pv">`}</div>
    ${st.kind==='photo'?`<div class="picks" role="group" aria-label="A poszt képei">${st.items.map((x,i)=>`<div class="pick" aria-current="${i===st.sel}"><button type="button" class="pk" data-c="sel" data-i="${i}" aria-label="${i+1}. kép"><img src="${x.url}" alt=""></button><button type="button" class="x" data-c="rm" data-i="${i}" aria-label="${i+1}. kép eltávolítása">×</button></div>`).join('')}${st.items.length<MAXP?`<button type="button" class="add-tile" data-c="addcam">${ic('camera')}Még egy</button>`:''}</div>`:''}
    <p class="hu-note ${(st.kind==='reel'?st.vhu:st.items.some(x=>x.hu))?'yes':''}">${(st.kind==='reel'?st.vhu:st.items.some(x=>x.hu))?'Vécében készült: beleszámít a rangodba.':'Nem vécében készült: felmegy, de nem számít a rangodba.'}</p>
    <div class="fx-strip" role="group" aria-label="Szűrők">${Object.entries(FX).map(([k,[n,css]])=>`<button type="button" class="fx" data-c="fx" data-v="${k}" aria-pressed="${st.filter===k}">${st.kind==='reel'?`<span class="fx-sw" style="filter:${css}"></span>`:`<img src="${first}" alt="" style="filter:${css}">`}${n}</button>`).join('')}</div>
    <form class="edit-form" id="ef"><textarea class="field" id="cap" rows="2" maxlength="2200" placeholder="Írj képaláírást…"></textarea>
    <div class="row2"><select class="field" id="dest" aria-label="Hova posztolod?"><option value="">Hírfolyam (mindenki látja)</option>${myGroups.map(g=>`<option value="${h(g.id)}" ${st.group===g.id?'selected':''}>Csoport: ${h(str(g.name,40))}</option>`).join('')}</select><button class="btn" type="submit" id="sh">Megosztás</button></div></form>`;
    applyFx();
    el.querySelector('#cap').value=oldCap; if(oldDest!==undefined&&[...el.querySelector('#dest').options].some(o=>o.value===oldDest)) el.querySelector('#dest').value=oldDest;
    el.querySelector('#ef').addEventListener('submit',e=>{ e.preventDefault(); share(); });
  }
  function addPhotos(entries){
    const fresh=st.kind==='photo'?st.items.slice():[]; const add=[]; let cut=0, twice=0;
    // inside one post several pictures of the same occasion are welcome (other angles); only the very same picture is refused
    for(const e of entries){ if(e.fp&&fresh.concat(add).some(x=>samePicture(e.fp,x.fp,null,x.fp&&x.fp.pm))){ twice++; continue; } if(fresh.length+add.length>=MAXP){ cut++; continue; } add.push(e); }
    if(twice) toast(twice===1?'Ez a kép már benne van a posztban.':twice+' kép már benne van a posztban.');
    if(!add.length) return;
    stop(); if(st.kind!=='photo') resetMedia(); st.kind='photo';
    for(const e of add) st.items.push({blob:e.blob,fp:e.fp||null,t:e.t,hu:!!e.hu,url:URL.createObjectURL(e.blob)});
    if(cut) toast('Egy posztba legfeljebb '+MAXP+' kép fér, '+cut+' kimaradt.');
    st.sel=Math.max(0,st.items.length-1); st.step='edit'; draw();
  }
  function applyFx(){ const pv=el.querySelector('#pv'); if(pv) pv.style.filter=fx(st.filter); el.querySelectorAll('.fx').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st.filter))); }
  function setMedia(b,kind,fp){ stop(); resetMedia(); st.blob=b; st.vfp=fp||null; st.kind=kind; st.url=URL.createObjectURL(b); st.step='edit'; draw(); }
  async function snap(){
    const v=el.querySelector('video.live'); if(!v||!v.videoWidth) return;
    const sc=Math.min(1,1440/Math.max(v.videoWidth,v.videoHeight)); const c=document.createElement('canvas'); c.width=Math.round(v.videoWidth*sc); c.height=Math.round(v.videoHeight*sc);
    const x=c.getContext('2d'); if(st.facing==='user'){ x.translate(c.width,0); x.scale(-1,1); } x.drawImage(v,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88)); if(!b) return;
    const t=now(), fp=await printOfImage(b,b); if(!fp||!fp.ok){ pushLayer(L_nopoop(false,fp)); return; }
    const dup=findDup(fp)||findShapeDup(fp&&fp.pm,t)||sameMoment(t); if(dup){ pushLayer(L_dup(dup,false)); return; }
    addPhotos([{blob:b,fp,t,hu:!!(fp.sc&&fp.sc.toilet)}]);
  }
  /* a reel recorded with the in-app camera */
  async function gotReel(f){
    if(f.size>20*1024*1024) return toast('A videó túl nagy (max. 20 MB). Vegyél fel rövidebbet.');
    const t=now(), vfp=await printOfVideo(f); if(!vfp||!vfp.ok){ pushLayer(L_nopoop(true,vfp)); return; }
    const vd=findDup(vfp)||findShapeDup(vfp&&vfp.pm,t)||sameMoment(t); if(vd){ pushLayer(L_dup(vd,true)); return; }
    st.mode='reel'; setMedia(f,'reel',vfp); st.vt=t; st.vhu=!!(vfp.sc&&vfp.sc.toilet); draw();
  }
  async function share(){
    if(st.busy) return; if(!S.db) return toast(OFF); if(!S.uid) return needId(); if(!S.assets) return toast(NOUP);
    const media=st.kind==='reel'?[{fp:st.vfp,t:st.vt,hu:st.vhu}]:st.items.map(x=>({fp:x.fp,t:x.t,hu:x.hu}));
    media.forEach(m=>{ if(typeof m.t!=='number') m.t=now(); });
    const bad=media.find(m=>!m.fp||!m.fp.ok); if(bad){ pushLayer(L_nopoop(st.kind==='reel',bad.fp)); return; }
    const prints=media.map(m=>m.fp).filter(Boolean); const hit=media.map(m=>(m.fp&&(findDup(m.fp)||findShapeDup(m.fp.pm,m.t)))||sameMoment(m.t)).find(Boolean);
    if(hit){ pushLayer(L_dup(hit,st.kind==='reel')); return; }
    const btn=el.querySelector('#sh'); st.busy=true; btn.disabled=true;
    btn.textContent='Feltöltés…';
    const ids=[]; const fail=()=>{ ids.forEach(id=>S.assets.delete(id).catch(()=>{})); st.busy=false; btn.disabled=false; btn.textContent='Újra'; };
    try{
      if(st.kind==='reel'){ const type=['video/mp4','video/webm'].includes(st.blob.type)?st.blob.type:'video/mp4'; ids.push((await S.assets.upload(st.blob,{type})).id); }
      else for(let i=0;i<st.items.length;i++){ btn.textContent=st.items.length>1?`Feltöltés ${i+1}/${st.items.length}…`:'Feltöltés…'; ids.push((await S.assets.upload(st.items[i].blob,{type:'image/jpeg'})).id); }
    }catch(e){ toast(upErr(e)); fail(); return; }
    if(!ids.length){ fail(); return; }
    const cap=el.querySelector('#cap').value.trim().slice(0,2200); const dest=el.querySelector('#dest').value;
    const kind=st.kind;
    const doc={author:S.uid,kind,asset:ids[0],caption:cap,filter:st.filter,group:dest||null,at:now(),likes:{},comments:{}}; if(ids.length>1) doc.assets=ids;
    doc.ct=media.map(m=>Math.min(m.t,doc.at)); doc.hu=media.some(m=>m.hu)?1:0;
    if(prints.length){ doc.fp=prints.map(f=>({d:f.d||'',c:f.c||'',f:f.f||''})); const sg=prints.map(f=>f.pm&&f.pm.sig?f.pm.sig:null); if(sg.some(Boolean)) doc.sg=sg; doc.ck=prints.map(f=>f.ck||null); }
    const before=rankOf(S.uid);
    const ok=await w(()=>S.db.collection('posts').add(doc));
    if(!ok){ fail(); return; }
    toast(kind==='reel'?'Reel megosztva':'Megosztva');
    const exp=(before.n+(doc.hu?1:0))/7; const ni=RANKS.reduce((a,r,j)=>exp>=r.min?j:a,0);
    if(doc.fp&&ok&&ok.id) indexPrints(ok.id,doc.fp,doc.at);
    if(ni>before.i) setTimeout(()=>toast('Rangot léptél: '+RANKS[ni].n+'!'),1400);
    popLayer(); if(!S.stack.length) setTab(kind==='reel'?'reels':'feed');
  }
  el.addEventListener('click',e=>{
    const b=e.target.closest('[data-c]'); if(!b) return; const c=b.dataset.c;
    if(c==='mode'){ st.mode=b.dataset.v; startLive(); drawShoot(); }
    else if(c==='flip'){ st.facing=st.facing==='user'?'environment':'user'; startLive(); }
    else if(c==='shoot'){ if(st.mode==='photo'&&st.live) snap(); else if(st.mode==='reel'&&st.live&&window.MediaRecorder) toggleRec(); else toast(st.live?'A felvétel ezen az eszközön nem működik.':'A kamera nem érhető el.'); }
    else if(c==='retry') startLive();

    else if(c==='fx'){ st.filter=Object.prototype.hasOwnProperty.call(FX,b.dataset.v)?b.dataset.v:'none'; applyFx(); }
    else if(c==='sel'){ st.sel=Number(b.dataset.i)||0; const pv=el.querySelector('#pv'); if(pv&&st.items[st.sel]) pv.src=st.items[st.sel].url; el.querySelectorAll('.pick').forEach((x,i)=>x.setAttribute('aria-current',String(i===st.sel))); }
    else if(c==='rm'){ const i=Number(b.dataset.i); const it=st.items[i]; if(!it) return; URL.revokeObjectURL(it.url); st.items.splice(i,1);
      if(!st.items.length){ st.step='shoot'; st.filter='none'; drawShoot(); startLive(); return; } st.sel=Math.min(st.sel,st.items.length-1); drawEdit(); }
    else if(c==='addcam'){ st.mode='photo'; st.step='shoot'; startLive(); }
    else if(c==='retake'){ resetMedia(); st.step='shoot'; drawShoot(); startLive(); }
  });
  drawShoot(); startLive();
  return {type:'camera',el,close(){ stop(); resetMedia(); }};
}

/* ranks from average daily posts over the last 7 days */
const RANKS=[

/* Rank medals: one drawing per rank, richer with every step.
   0 a dull disc with a crossed-out swirl · 1-3 a ribbon and one, two, three stripes · 4-6 a toothed rim and one, two, three stars

const shade=(hex,k)=>{ const n=parseInt(hex.slice(1),16); return '#'+[n>>16,(n>>8)&255,n&255].map(v=>Math.round(k<0?v*(1+k):v+(255-v)*k).toString(16).padStart(2,'0')).join(''); };
const MD_SWIRL='M50 20c1.500 4.500 6.500 5.500 6.500 10.500 0 2-.900 3.600-2.400 4.800 5.200.800 9.400 4 9.400 8.700 0 2.300-1 4.200-2.600 5.700 4.700 1.200 8.300 4.600 8.300 9 0 5.300-5 8.300-11.200 8.300h-16c-6.200 0-11.200-3-11.200-8.300 0-4.400 3.600-7.800 8.300-9-1.600-1.500-2.600-3.400-2.600-5.700 0-4.700 4.200-7.900 9.400-8.700 3.300-1.200 5.200-3.600 5.400-7.300.100-2.400-.800-4.900-1.300-8z';

function rankMedalSvg(i){

  s+=`<circle cx="50" cy="${cy}" r="36" fill="url(#${id})" stroke="${lo}" stroke-width="2"/>`+(i>=2?`<circle cx="50" cy="${cy}" r="30.500" fill="none" stroke="${hi}" stroke-width="1.500" opacity=".75"/>`:'');
  if(i>=6) s+=`<path d="M30 60A26 26 0 0 1 30 28M70 60A26 26 0 0 0 70 28" fill="none" stroke="${ink}" stroke-width="5" stroke-dasharray="5.500 3" stroke-linecap="round" opacity=".5"/>`;
